spring.application.name=cache-conteudos

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:conteudosdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Configuracao do cache
app.cache.max-itens=5
app.cache.ttl-segundos=60

# Atraso artificial da "fonte lenta" (em milissegundos)
app.fonte.atraso-ms=2000
